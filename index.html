<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22393A">
<meta name="description" content="안산 거주 외국인 주민을 위한 다국어 생활 안내 · Life in Ansan for foreign residents">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="안산살이">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>안산살이 Ansan Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&family=Playfair+Display:ital,wght@0,700;1,400&family=Quicksand:wght@400;500;600;700&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-sized app; on desktop it sits in a framed device on a sage backdrop */
:root{
  --bg:#F3F2EF; --sheet:#FFFFFF; --ink:#1E2221; --muted:#6E7472; --hair:#DCDCD8;
  --deep:#22393A; --sage:#8FA7AC; --accent:#E45C4E; --accent-soft:#FBE7E4;
  --gen:#3A4442; --food:#EE8A3C; --rec:#4E8F87; --bus:#2F8F5B; --l4:#00A5DE; --sb:#F5A200; --sh:#8FC31F; --walk:#A3A8A6;
  --backdrop:#C9D6D8;
  --serif:"Playfair Display","Noto Serif KR",Georgia,serif;
  --serif-ko:"Noto Serif KR","Playfair Display",serif;
  --sans:"Quicksand","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ko:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--backdrop);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* stage + device */
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px}
#phone{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 10px #1B2526,0 30px 80px rgba(20,35,36,.35);flex:none;transform-origin:center}
#aside{max-width:300px;display:flex;flex-direction:column;gap:14px;color:var(--deep)}
#aside h1{font-family:var(--serif-ko);font-size:40px;margin:0;line-height:1.1}
#aside p{margin:0;font-size:14px;line-height:1.6;color:#41534F}
#aside .tag{font-size:11px;letter-spacing:3px;font-weight:700;text-transform:uppercase}
@media (max-width:820px){#aside{display:none}}
@media (max-width:500px){
  body{background:var(--bg)}
  #stage{padding:0;display:block}
  #phone{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important}
}
#app{position:absolute;inset:0;overflow:hidden}

/* screen scaffolding */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow-y:auto;overflow-x:hidden;animation:in .28s ease both;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.nav{display:flex;align-items:center;gap:10px;padding:52px 22px 0;flex:none}
.nav .rule{flex:1;height:1px;background:currentColor;opacity:.45}
.nav .lbl{font-weight:500;font-size:14px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:20px;margin:-8px}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:4px 10px 4px 4px;font-size:12px;font-weight:700}
.ttl{padding:20px 28px 22px;display:flex;flex-direction:column;gap:4px;flex:none}
.eyebrow{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted)}
.h1{font-family:var(--serif);font-weight:700;font-size:31px;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.3px}
.ko .h1,.h1.ko{font-family:var(--serif-ko)}
.sub{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kr{font-family:var(--ko)}
.sheet{flex:1 0 auto;background:var(--sheet);border-top-left-radius:48px;padding:26px 24px 22px;display:flex;flex-direction:column;gap:14px}
.foot{flex:none;background:var(--sage);color:#fff;font-size:12px;text-align:right;padding:12px 28px calc(12px + env(safe-area-inset-bottom,0px))}
.spacer{flex:1}
.h2{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:17px}
.h2 .k{font-family:var(--ko);font-weight:400;font-size:11px;color:var(--muted)}
.h2 .ln{flex:1;height:1px;background:var(--ink);opacity:.25}
.muted{color:var(--muted)}
.small{font-size:12px}.tiny{font-size:11px}.micro{font-size:10px}
.b{font-weight:700}
.card{background:var(--bg);border-radius:20px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.grow{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.idot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.btn{height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:15px;width:100%}
.btn.dark{background:var(--deep);color:#fff}
.btn.line{background:#fff;border:1px solid var(--hair)}
.btn.sq{width:54px;flex:none}
.btn[disabled]{background:#ECEDEB;color:#A3A8A6;cursor:not-allowed}
.acts{display:flex;gap:10px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;background:#fff;color:var(--deep)}
.badge{border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.hair{height:1px;background:var(--ink);opacity:.12}
.ticket{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:20px;padding:14px 16px}
.dash{width:0;align-self:stretch;border-left:1px dashed rgba(30,34,33,.3)}
.cap{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.serif{font-family:var(--serif);font-weight:700}
.it{font-family:var(--serif);font-style:italic}
.accent{color:var(--accent)}
.soft-accent{background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.toggle{width:44px;height:26px;border-radius:13px;background:#D5D8D6;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:left .2s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{left:21px}

/* intro */
.intro{background:#fff}
.hero{position:relative;flex:1 0 auto;min-height:640px;border-bottom-right-radius:120px;overflow:hidden;color:var(--deep)}
.bgl{position:absolute;inset:0;background-size:cover;background-position:center 60%;transition:opacity 1.8s ease}
.shade{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to bottom,rgba(22,41,42,0),rgba(22,41,42,.45) 35%,rgba(18,34,36,.88))}
.hero-in{position:relative;height:100%;display:flex;flex-direction:column;padding:72px 0 30px}
.toprule{display:flex;align-items:center;gap:10px;padding:0 32px}
.toprule i{display:block;width:120px;height:1px;background:var(--deep);opacity:.55}
.welcome{padding:24px 32px 0}
.welcome .w{font-family:var(--serif);font-style:italic;font-size:20px;opacity:.85}
.welcome .t{font-family:var(--serif-ko);font-weight:700;font-size:48px;letter-spacing:-1px;line-height:1.2}
.welcome .s{font-size:12px;font-weight:600;letter-spacing:4px;opacity:.8;display:flex;gap:8px;align-items:center}
.welcome .s em{font-family:var(--serif);letter-spacing:0;font-size:13px}
.q{padding:22px 32px 0}
.q i{display:block;width:28px;height:1.5px;background:var(--deep);margin-bottom:14px}
.q b{font-family:var(--serif-ko);font-size:20px;display:block}
.q span{font-family:var(--serif);font-style:italic;font-size:14px}
.rail{margin-top:auto;display:flex;align-items:flex-end;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:32px;padding:30px 80px 4px 32px;scrollbar-width:none;min-height:160px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
.rail.dragging{cursor:grabbing;scroll-snap-type:none}
.rail.dragging .cc{pointer-events:none}
.cc img,.cc svg{-webkit-user-drag:none;pointer-events:none}
/* press (touchdown) + hover feedback on every control */
.fx{transition:transform .14s ease,filter .14s ease,box-shadow .2s ease,background-color .2s ease}
.fx.is-pressed{transform:scale(.97);filter:brightness(.94)}
.btn.fx.is-pressed,.go.fx.is-pressed{transform:scale(.96)}
.toc .fx.is-pressed,.listrow.fx.is-pressed{transform:none;filter:none;background:rgba(30,34,33,.05);border-radius:12px}
.toc .fx.is-pressed .idot,.listrow.fx.is-pressed .bag{transform:scale(1.08)}
.toc .idot,.listrow .bag{transition:transform .14s ease}
.opt.fx.is-pressed,.choice.fx.is-pressed,.qopt.fx.is-pressed,.card.fx.is-pressed,.ticket.fx.is-pressed{transform:translateY(-3px) scale(.99);box-shadow:0 10px 22px rgba(30,34,33,.12);filter:none}
.shutter.fx.is-pressed i{transform:scale(.88)}
.shutter i{transition:transform .14s ease}
.cc.is-pressed{transform:translateY(-12px) rotate(-1.5deg)}
.cc.is-pressed ~ .cc{transform:translateX(30px)}
@media (hover:hover){
 .cc:hover{transform:translateY(-12px) rotate(-1.5deg)}
 .cc:hover ~ .cc{transform:translateX(30px)}
 .fx:not(.cc):hover{filter:brightness(.97)}
 .opt.fx:hover,.choice.fx:hover,.qopt.fx:hover,.card.fx:hover,.ticket.fx:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(30,34,33,.1);filter:none}
 .toc .fx:hover .idot,.listrow.fx:hover .bag{transform:scale(1.08)}
 .toc .fx:hover,.listrow.fx:hover{filter:none}
}
.rail.dragging .cc{transform:none!important}
@media (prefers-reduced-motion:reduce){.fx,.cc{transition:none}}
.rail::-webkit-scrollbar{display:none}
.cc{position:relative;flex:none;width:132px;height:116px;border-radius:20px;margin-left:-34px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:-10px 6px 24px rgba(13,26,26,.28);scroll-snap-align:start;transition:height .25s,width .25s,background .25s,transform .25s}
.cc:first-child{margin-left:0}
.cc .fl{width:32px;height:32px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.cc .num{position:absolute;right:14px;top:22px;font-family:var(--serif);font-style:italic;font-size:13px;opacity:.85}
.cc .nm{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.15}
.cc .nm.zh{font-family:"Noto Serif KR",serif;font-size:19px}
.cc .nm.cy{font-family:"Noto Serif KR",Georgia,serif}
.cc .kk{font-family:var(--ko);font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc[aria-pressed="true"]{width:140px;height:128px;background:rgba(255,255,255,.95);color:var(--deep);z-index:5;box-shadow:-10px 6px 24px rgba(13,26,26,.38)}
.cc[aria-pressed="true"] .num{display:none}
.cc .chk{position:absolute;right:14px;top:18px;width:24px;height:24px;border-radius:12px;background:var(--accent);display:none;place-items:center}
.cc[aria-pressed="true"] .chk{display:grid}
.locrow{display:flex;align-items:center;justify-content:space-between;padding:22px 32px 0;color:#fff;font-size:13px;font-weight:500}
.swipe{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;margin-right:40px}
.swipe i{display:block;width:56px;height:2px;background:rgba(255,255,255,.3);position:relative;overflow:hidden;border-radius:1px}
.swipe i b{position:absolute;left:0;top:0;height:2px;width:20px;background:#fff;transition:left .2s}
.cont{display:flex;align-items:center;justify-content:space-between;padding:26px 32px calc(30px + env(safe-area-inset-bottom,0px));flex:none}
.cont .l b{font-family:var(--serif);font-size:22px;display:block}
.cont .l.ko b{font-family:var(--serif-ko);font-size:20px}
.go{width:56px;height:56px;border-radius:28px;display:grid;place-items:center;background:#ECEDEB;color:#A3A8A6;transition:all .25s}
.go:not([disabled]){background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(228,92,78,.35)}
.soon{margin:10px 32px 0;align-self:flex-start;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;border-radius:16px;padding:7px 12px;font-size:12px}
@media (prefers-reduced-motion:reduce){.bgl{transition:none}.scr{animation:none}}

/* home list */
.toc a,.toc button{display:flex;align-items:center;gap:14px;padding:12px 0 10px;border-bottom:1px solid rgba(30,34,33,.3);width:100%;text-align:left}
.toc .lab{flex:1;display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-size:17px;font-weight:700;min-width:0}
.ko .toc .lab{font-family:var(--serif-ko);font-weight:700;font-size:16px}
.toc .lab small{font-family:var(--ko);font-weight:400;font-size:11px;color:var(--muted)}
.toc .n{font-family:var(--serif);font-weight:700}
.toc .adnote{flex-basis:100%;font-family:var(--sans);font-style:normal;font-weight:600;font-size:11px;color:var(--accent);letter-spacing:0}
.quote{display:flex;gap:14px}
.quote::before{content:"";width:1.5px;background:var(--ink);flex:none}

/* waste */
.week{display:flex;justify-content:space-between}
.day{width:42px;border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.day.today{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink);font-weight:700}
.dots{display:flex;flex-direction:column;gap:3px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.bag{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.listrow{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:4px 10px 4px 8px;font-size:11px;font-weight:600}

/* camera */
.cam{background:radial-gradient(circle at 50% 42%,#6B7A76 0,#2A3533 55%,#151D1C 100%);color:#fff}
.vf{position:absolute;left:60px;right:60px;top:250px;height:320px}
.vf svg.c{position:absolute;inset:0;width:100%;height:100%}
.vf img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:cover;border-radius:12px}
.camtop{position:absolute;left:24px;right:24px;top:calc(48px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center}
.glass{background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.camhint{position:absolute;left:50%;transform:translateX(-50%);top:196px;display:flex;gap:8px;align-items:center;border-radius:20px;padding:8px 14px 8px 12px;white-space:nowrap}
.camctl{position:absolute;left:0;right:0;bottom:0;padding:16px 45px calc(40px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(15,23,22,0),rgba(15,23,22,.9) 35%,#0F1716);display:flex;flex-direction:column;gap:18px}
.modes{display:flex;gap:22px;justify-content:center;font-size:13px}
.shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter i{width:62px;height:62px;border-radius:50%;background:#fff;display:block}
.scanline{position:absolute;left:0;right:0;height:70px;background:linear-gradient(to bottom,rgba(228,92,78,0),rgba(228,92,78,.35) 92%,var(--accent));animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 70px)}}
.vf video{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:cover;border-radius:12px;opacity:0;transition:opacity .3s;background:#0F1716}
.vf.live video{opacity:1}
.vf.live .demo{display:none}
.cam.live #camnote{display:none}
.toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;border-radius:16px;padding:10px 16px;font-size:13px;font-weight:600;z-index:40;white-space:nowrap;animation:fade .2s;box-shadow:0 8px 20px rgba(20,35,36,.25)}
#lmsg{line-height:1.5;color:var(--muted)}
#lmsg.err{color:#B4372B}
.dtog{width:38px;height:34px;border-radius:12px;background:var(--bg);font-size:12px;font-weight:700;color:var(--muted)}
.dtog[aria-pressed="true"]{background:var(--deep);color:#fff}
.rulegrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.tfield{display:flex;flex-direction:column;gap:4px;flex:1}
.tfield input{height:46px;border-radius:16px;border:0;background:var(--bg);padding:0 14px;font:inherit;font-size:15px;color:var(--ink)}
.livetag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--accent)}
.livetag::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--accent);animation:blink 1.4s infinite}
.nitem{display:flex;gap:14px;text-align:left;width:100%}
.nitem::before{content:"";width:1.5px;background:var(--ink);flex:none}
.skel{height:56px;border-radius:18px;background:linear-gradient(90deg,var(--bg),#ECEBE7,var(--bg));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* Cyrillic / CJK: Quicksand & Playfair have no glyphs → system + Noto */
.l-ru,.l-mn{--sans:"Noto Sans","Noto Sans KR",system-ui,sans-serif}
.l-zh{--serif:"Noto Serif SC","Songti SC","Noto Serif KR",serif;--sans:"Noto Sans SC","Noto Sans KR",system-ui,sans-serif}
.bottomsheet{position:absolute;left:0;right:0;bottom:0;background:#fff;color:var(--ink);border-top-left-radius:48px;padding:26px 28px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ld i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:4px;animation:blink 1s infinite}
.ld i:nth-child(2){animation-delay:.2s}.ld i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.stat{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;flex:none;border:2px solid var(--hair)}
.stat.done{background:var(--deep);border-color:var(--deep)}
.stat.doing{border-color:var(--accent)}
.stat.doing::after{content:"";width:8px;height:8px;border-radius:4px;background:var(--accent)}

/* search */
.field{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:22px;height:46px;padding:0 16px}
.field input{flex:1;border:0;background:none;font:inherit;font-size:14px;outline:none;color:var(--ink);min-width:0}

/* transit */
.seg{height:20px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;padding:0 6px;white-space:nowrap;overflow:hidden}
.opt{display:flex;flex-direction:column;gap:10px;border-radius:20px;padding:14px 16px;background:var(--bg);text-align:left;width:100%}
.opt.best{background:#fff;box-shadow:inset 0 0 0 1.5px var(--accent)}
.tl{display:flex;gap:14px}
.tl .rail2{display:flex;flex-direction:column;align-items:center;flex:none}
.tl .rail2 .ln{flex:1;width:3px;min-height:16px}
.tl .rail2 .ln.walk{width:0;border-left:2px dashed var(--walk)}
.board{background:var(--deep);color:#fff}
.sheetover{position:absolute;inset:0;background:rgba(12,20,20,.55);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.bs{background:#fff;width:100%;border-top-left-radius:32px;border-top-right-radius:32px;padding:12px 24px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--hair);align-self:center}
.choice{display:flex;align-items:center;gap:14px;border-radius:18px;padding:14px 16px 14px 14px;background:var(--bg);text-align:left;width:100%}
.choice.rec{background:#fff;box-shadow:inset 0 0 0 1.5px var(--accent)}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid #B9C2BE;display:grid;place-items:center;flex:none}
.ck[aria-checked="true"]{background:var(--deep);border-color:var(--deep)}

/* survey */
.qopt{display:flex;align-items:center;gap:14px;border-radius:18px;padding:0 16px 0 14px;height:64px;background:var(--bg);width:100%;text-align:left}
.qopt[aria-pressed="true"]{background:#fff;box-shadow:inset 0 0 0 1.5px var(--accent),0 6px 16px rgba(228,92,78,.15)}
.radio{width:22px;height:22px;border-radius:11px;border:1.5px solid #B9C2BE;display:grid;place-items:center;flex:none;background:#fff}
.qopt[aria-pressed="true"] .radio{background:var(--accent);border-color:var(--accent)}
.prog{flex:1;height:3px;border-radius:2px;background:rgba(30,34,33,.12);position:relative;overflow:hidden}
.prog b{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .3s}

/* live map (Naver Maps JS v3) */
.nmap{position:relative;overflow:hidden;background:#DCE6E7}
.nmap.mini{height:170px;border-radius:20px;flex:none}
.nmap .live{position:absolute;inset:0;opacity:0;transition:opacity .4s}
.nmap.ready .live{opacity:1}
.nmap.ready .fallback{visibility:hidden}
.nmap .fallback{position:absolute;inset:0;width:100%;height:100%}
.nmap .maptag{position:absolute;left:12px;bottom:10px;z-index:2;font-size:10px;font-weight:700;color:#4E6B70;background:rgba(255,255,255,.8);border-radius:8px;padding:2px 7px}
.nmap.ready .maptag{display:none}
.npin{transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px}
.npin b{display:block;width:26px;height:26px;border-radius:13px 13px 13px 0;transform:rotate(-45deg);background:var(--accent);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.npin b::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#fff}
.npin b{position:relative}
.npin span{font:700 11px/1.2 var(--sans);background:#fff;color:var(--ink);border-radius:8px;padding:3px 7px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15);margin-top:4px}
.npin.home b{background:var(--deep)}

/* modal */
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;background:rgba(19,32,33,.55);display:grid;place-items:center;z-index:100;padding:24px}
#modal .box{background:#fff;border-radius:28px;max-width:380px;width:100%;padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
#modal h2{font-family:var(--serif-ko);margin:0;font-size:22px}
#modal p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.qr{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:16px;padding:12px 14px;font-size:12px;color:var(--muted)}
.qr code{font-size:11px;color:var(--ink);word-break:break-all}

/* ---------- live map: NAVER Maps JS API v3 ----------
   1) NCP 콘솔 > Maps > Application 등록 (Dynamic Map + Geocoding 체크)
   2) Web 서비스 URL에 이 페이지를 올릴 도메인 등록
   3) 발급받은 Client ID를 아래 NAVER_KEY에 넣기. 비어 있으면 그림 지도로 보여요. */
const NAVER_KEY='';
/* API 서버 주소 (server/README.md): 사진 분석 · 버스 실시간 · 공지 번역. 비어 있으면 예시 데이터로 보여요. */
const API_URL=''.replace(/\/+$/,'');
const hasApi=()=>!!API_URL&&!API_URL.startsWith('__');
const hasAnalyzer=hasApi;
/* Supabase (supabase/schema.sql): 공지·광고·설문 응답. 공개(anon) 키만 씁니다. 비어 있으면 예시 데이터 */
const SB_URL=''.replace(/\/+$/,''),SB_KEY='';
const hasSb=()=>!!SB_URL&&!SB_URL.startsWith('__')&&!!SB_KEY&&!SB_KEY.startsWith('__');
async function sb(path,opt={},ms=10000){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),ms);
 try{const r=await fetch(`${SB_URL}/rest/v1/${path}`,{...opt,headers:{apikey:SB_KEY,authorization:`Bearer ${SB_KEY}`,'content-type':'application/json',...(opt.headers||{})},signal:ctl.signal});if(!r.ok)throw new Error('sb '+r.status);return r.status===201||r.status===204?null:await r.json();}finally{clearTimeout(to)}}
/* 광고 네트워크(애드센스): 직접 광고가 없을 때만 */
const ADS_CLIENT='',ADS_SLOT='';
const hasAdsense=()=>/^ca-pub-\d+$/.test(ADS_CLIENT)&&/^\d+$/.test(ADS_SLOT);
async function api(path,opt={},ms=12000){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),ms);
 try{const r=await fetch(API_URL+path,{...opt,signal:ctl.signal});if(!r.ok)throw new Error('http '+r.status);return await r.json();}finally{clearTimeout(to)}}
const MAPS={
 hosp:{zoom:16,pts:[{addr:'경기도 안산시 단원구 적금로 123',label:'고려대학교 안산병원'}]},
 near:{zoom:15,pts:[{addr:'경기도 안산시 단원구 원포공원1로 59',label:'Home',home:true},{addr:'경기도 안산시 단원구 중앙대로 620',label:'초지역 Choji'}]},
 offices:{zoom:14,pts:[{addr:'경기도 안산시 단원구 원포공원1로 59',label:'Home',home:true},{addr:'경기도 안산시 단원구 화랑로 387',label:'안산시청'}]}};
const miniMap=k=>`<div class="nmap mini" data-map="${k}"><div class="live"></div><svg class="fallback" viewBox="0 0 342 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g stroke="#fff" stroke-linecap="round" fill="none"><path d="M-10 120 C 80 100,150 140,230 95 S 330 60,350 70" stroke-width="12"/><path d="M110 -10 L 150 180" stroke-width="8"/><path d="M-10 50 L 350 30" stroke-width="6"/><path d="M260 -10 L 230 180" stroke-width="5"/></g><path d="M171 92s12-11 12-20a12 12 0 0 0-24 0c0 9 12 20 12 20z" fill="#E45C4E"/><circle cx="171" cy="72" r="4.5" fill="#fff"/></svg><span class="maptag">MAP · NAVER API</span></div>`;
let naverP=null;const geoCache={};
function loadNaver(){if(!NAVER_KEY||NAVER_KEY.startsWith('__'))return Promise.resolve(null);if(naverP)return naverP;
 naverP=new Promise(res=>{window.navermap_authFailure=()=>res(null);const s=document.createElement('script');s.src=`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${enc(NAVER_KEY)}&submodules=geocoder`;s.onload=()=>res(window.naver&&window.naver.maps?window.naver:null);s.onerror=()=>res(null);document.head.appendChild(s);});return naverP;}
function geocode(N,addr){if(geoCache[addr])return geoCache[addr];geoCache[addr]=new Promise(res=>{try{N.maps.Service.geocode({query:addr},(status,r)=>{const a=status===N.maps.Service.Status.OK&&r.v2&&r.v2.addresses&&r.v2.addresses[0];res(a?new N.maps.LatLng(+a.y,+a.x):null);});}catch(e){res(null)}});return geoCache[addr];}
async function mountMaps(){const els=[...app.querySelectorAll('.nmap[data-map]')];if(!els.length)return;const N=await loadNaver();if(!N)return;
 for(const el of els){if(!el.isConnected)continue;const spec=MAPS[el.dataset.map];const ll=(await Promise.all(spec.pts.map(p=>p.home&&st.addr.lat?new N.maps.LatLng(st.addr.lat,st.addr.lng):geocode(N,p.home?st.addr.full:p.addr))));const pts=spec.pts.map((p,i)=>({...p,ll:ll[i]})).filter(p=>p.ll);if(!pts.length||!el.isConnected)continue;
  const map=new N.maps.Map(el.querySelector('.live'),{center:pts[pts.length-1].ll,zoom:spec.zoom,scaleControl:false,mapDataControl:false,logoControlOptions:{position:N.maps.Position.BOTTOM_RIGHT}});
  pts.forEach(p=>new N.maps.Marker({position:p.ll,map,icon:{content:`<div class="npin ${p.home?'home':''}"><b></b><span>${p.label}</span></div>`,anchor:new N.maps.Point(0,0)}}));
  if(pts.length>1){const b=new N.maps.LatLngBounds(pts[0].ll,pts[0].ll);pts.forEach(p=>b.extend(p.ll));map.fitBounds(b,{top:50,right:40,bottom:30,left:40});}
  el.classList.add('ready');}}

  const g=base.region,L=base.land,num=L?`${L.number1||''}${L.number2?'-'+L.number2:''}`:'';
  const short=road&&L?`${L.name} ${num}`.trim():jib&&L?`${g.area3.name} ${num}`.trim():g.area3.name;
  const A=r.v2.address||{};
  res({inAnsan:/안산/.test(g.area2&&g.area2.name||''),road:short,dong:adm?adm.region.area3.name:g.area3.name,full:A.roadAddress||A.jibunAddress||`${g.area1.name} ${g.area2.name} ${short}`,lat,lng});});}catch(e){res(null)}});}

function locSheet(){const t=T();const o=document.createElement('div');o.className='sheetover';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label',t.locT);
 o.innerHTML=`<div class="bs"><span class="grab"></span><span class="eyebrow">${t.change}</span><span class="h1 ${isKo()?'ko':''}" style="font-size:26px">${t.locT}</span>${koSub('어디에 사세요?')}<span class="small muted">${t.locS}</span>
  <button class="choice rec" id="lgps" type="button">${dotI('spot','var(--deep)','#fff',40)}<span class="col grow"><span class="b">${t.useGps}</span>${koSub('현재 위치 사용')}</span>${ic('arrow',16,'#6E7472')}</button>
  <span class="micro muted" style="margin-top:-4px">${t.locConsent}</span>
  <form id="lform" class="col" style="gap:10px"><label class="field">${ic('search',18,'#6E7472')}<input id="laddr" type="text" enterkeyhint="done" autocomplete="street-address" placeholder="${t.addrPh}" aria-label="${t.addrPh}"></label>
   <div id="lmsg" class="small" role="status" aria-live="polite" hidden></div>
   <div class="acts"><button type="button" class="btn line" id="lkeep">${t.keep}</button><button type="submit" class="btn dark">${t.save}</button></div></form>
  <div class="card row small" style="padding:10px 12px"><span class="dot" style="background:var(--accent)"></span><span class="col"><span class="cap">${t.locCur}</span><span class="kr b">${addrLabel()}</span></span></div></div>`;
 const msg=(m,err)=>{const e=o.querySelector('#lmsg');e.hidden=!m;e.textContent=m||'';e.classList.toggle('err',!!err)};
 const focusAddr=()=>{const i=o.querySelector('#laddr');try{i.focus()}catch(e){}};
 const done=a=>{saveAddr(a);o.remove();render();toast(T().locSaved);};
 o.querySelector('#lgps').addEventListener('click',async()=>{const t=T();
  if(!navigator.geolocation||!window.isSecureContext){msg(t.gpsDenied,1);focusAddr();return}
  msg(t.gpsWorking);let pos;
  try{pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:12000,maximumAge:60000}))}
  catch(e){msg(e&&e.code===1?t.gpsDenied:t.gpsFail,1);focusAddr();return}
  if(!o.isConnected)return;const lat=pos.coords.latitude,lng=pos.coords.longitude;
  const N=await loadNaver();
  if(!N){if(!inAnsanBox(lat,lng)){msg(t.onlyAnsan,1);return}msg(t.gpsNoKey,1);focusAddr();return}
  const a=await revGeo(N,lat,lng);if(!o.isConnected)return;
  if(!a){msg(t.gpsFail,1);focusAddr();return}
  if(!a.inAnsan){msg(t.onlyAnsan,1);return}
  done(a);});
 o.querySelector('#lform').addEventListener('submit',async e=>{e.preventDefault();const t=T();const v=o.querySelector('#laddr').value.trim().slice(0,80);if(!v){focusAddr();return}
  const q=/안산/.test(v)?v:`경기도 안산시 ${v}`;const N=await loadNaver();
  if(!N){done({road:v.replace(/^(경기도\s*)?안산시\s*((단원|상록)구\s*)?/,'')||v,dong:'',full:q});return}
  msg(t.gpsWorking);const hit=await geoText(N,q);if(!o.isConnected)return;
  const full=hit&&(hit.roadAddress||hit.jibunAddress)||'';
  if(!hit||!/안산/.test(full)){msg(t.onlyAnsan,1);return}
  const a=await revGeo(N,+hit.y,+hit.x);
  done(a&&a.inAnsan?a:{road:v,dong:'',full,lat:+hit.y,lng:+hit.x});});
 o.querySelector('#lkeep').addEventListener('click',()=>o.remove());
 o.addEventListener('click',e=>{if(e.target===o)o.remove()});
 app.appendChild(o);tagFx(o);}

/* ---------- render + behaviors ---------- */
let bgTimer=null,scanTimer=null;
function render(){clearInterval(bgTimer);clearTimeout(scanTimer);clearTimeout(arrTimer);scanSeq++;const n=cur();if(n!=='w2')stopCam();if(n!=='rules')st.rulesDraft=null;
 app.className='l-'+(st.lang||'en');document.documentElement.lang=st.lang||'ko';app.innerHTML=SCR[n]();
 if(n==='intro')bindIntro();
 if(n==='w3')runScan();
 if(n==='home'||n==='news')loadAd();
 if(n==='b2'){const f=document.getElementById('destf');f&&f.addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('dest').value.trim().slice(0,80);if(v)routeTo(v,/(로|길|동|구)\s*\d/.test(v)?(/안산/.test(v)?v:'경기도 안산시 '+v):null);});}
 if(hasApi()){if(n==='b1')loadStops();if(n==='b4')loadArr();if(n==='news')loadNews();}
 mountMaps();
 if(n==='w2'){['ph','ph2'].forEach(id=>{const i=document.getElementById(id);i&&i.addEventListener('change',()=>{const f=i.files&&i.files[0];if(f)readPhoto(f);});});
  document.getElementById('shut').addEventListener('click',e=>{if(camStream){e.preventDefault();capture();}});startCam();}
 if(n==='w5'){const q=document.getElementById('q');q.addEventListener('input',()=>{st.query=q.value;const pos=q.selectionStart;app.innerHTML=SCR.w5();const q2=document.getElementById('q');q2.focus();try{q2.setSelectionRange(pos,pos)}catch(e){}render.bindW5&&0;rebindW5();});}
}
function rebindW5(){const q=document.getElementById('q');q.addEventListener('input',()=>{st.query=q.value;const pos=q.selectionStart;app.innerHTML=SCR.w5();const q2=document.getElementById('q');q2.focus();try{q2.setSelectionRange(pos,pos)}catch(e){}rebindW5();});}
function bindIntro(start=true){const A=document.getElementById('bgA'),B=document.getElementById('bgB');let on=start;
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 bgTimer=setInterval(()=>{on=!on;A.style.opacity=on?1:0;B.style.opacity=on?0:1;},reduce?12000:5500);
 const rail=document.getElementById('rail');const sw=document.getElementById('swb');
 rail.addEventListener('scroll',()=>{const p=rail.scrollLeft/Math.max(1,rail.scrollWidth-rail.clientWidth);sw.style.left=(p*36)+'px'},{passive:true});
 // drag-to-scroll with momentum (mouse/pen; touch keeps native swipe)
 let down=false,sx=0,sl=0,lx=0,lt=0,v=0,raf=0;
 rail.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button!==0)return;down=true;dragMoved=false;sx=lx=e.clientX;sl=rail.scrollLeft;lt=performance.now();v=0;cancelAnimationFrame(raf);});
 rail.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(!dragMoved&&Math.abs(dx)>5){dragMoved=true;rail.classList.add('dragging');try{rail.setPointerCapture(e.pointerId)}catch(_){}}
  if(dragMoved){rail.scrollLeft=sl-dx;const now=performance.now();v=(e.clientX-lx)/Math.max(1,now-lt);lx=e.clientX;lt=now;}});
 const up=e=>{if(!down)return;down=false;if(!dragMoved)return;let vel=v*16;const step=()=>{if(Math.abs(vel)<.4){rail.classList.remove('dragging');return}rail.scrollLeft-=vel;vel*=.94;raf=requestAnimationFrame(step)};step();setTimeout(()=>{dragMoved=false},0);};
 rail.addEventListener('pointerup',up);rail.addEventListener('pointercancel',up);rail.addEventListener('pointerleave',up);
 rail.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){rail.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
}
let dragMoved=false;
app.addEventListener('click',e=>{const el=e.target.closest('[data-sel],[data-go],[data-act],[data-naver],[data-ans],[data-cand],[data-day],[data-stop],[data-news],[data-route],#goBtn,#remind,#ntf');if(!el)return;
 if(el.dataset.sel){if(dragMoved)return;const keep=document.getElementById('rail').scrollLeft;const A0=document.getElementById('bgA');const orangeOn=A0&&A0.style.opacity!=='0';st.sel=el.dataset.sel;clearInterval(bgTimer);app.innerHTML=SCR.intro().replace('class="scr intro"','class="scr intro" style="animation:none"');
  const A=document.getElementById('bgA'),B=document.getElementById('bgB');A.style.transition=B.style.transition='none';A.style.opacity=orangeOn?1:0;B.style.opacity=orangeOn?0:1;void A.offsetWidth;A.style.transition=B.style.transition='';
  bindIntro(orangeOn);document.getElementById('rail').scrollLeft=keep;return;}
 if(el.id==='goBtn'){const c=COUNTRIES.find(x=>x.c===st.sel);if(c&&c.lang){st.lang=c.lang;home();}return;}
 if(el.id==='remind'){st.remind=!st.remind;render();return;}
 if(el.id==='ntf'){st.notify=!st.notify;el.setAttribute('aria-pressed',st.notify);return;}
 if(el.dataset.naver){openNaver(el.dataset.naver);return;}
 if(el.dataset.ans!=null){st.answers[st.qi]=+el.dataset.ans;render();return;}
 if(el.dataset.day){const [k,d]=el.dataset.day.split(':');const R=st.rulesDraft;const i=R[k].indexOf(+d);i<0?R[k].push(+d):R[k].splice(i,1);R[k].sort();el.setAttribute('aria-pressed',i<0);return;}
 if(el.dataset.route!=null){const p=PLACES()[+el.dataset.route];if(p)routeTo(p.q,p.addr);return;}
 if(el.dataset.stop!=null){const x=st.stops&&st.stops.list[+el.dataset.stop];if(x){st.stop=x;go('b4');}return;}
 if(el.dataset.news!=null){st.nsel=+el.dataset.news;st.showOrig=false;go('ndetail');return;}
 if(el.dataset.cand!=null){const c=st.result&&st.result.candidates[+el.dataset.cand];if(c){st.result={...c,demo:st.result.demo,confidence:1,candidates:[]};render();}return;}
 if(el.dataset.go){if(el.dataset.go==='w2')st.photo=null;go(el.dataset.go);return;}
 const a=el.dataset.act;
 if(a==='back')back();else if(a==='home')home();else if(a==='loc')locSheet();
 else if(a==='sample'){stopCam();st.photo=null;go('w3');}
 else if(a==='rsave'){const R=st.rulesDraft;const tm=(id,d)=>{const v=document.getElementById(id).value;return /^\d{2}:\d{2}$/.test(v)?v:d};R.from=tm('rfrom','20:00');R.to=tm('rto','06:00');if(!validRules(R))return;saveRules(JSON.stringify(R)===JSON.stringify(CITY)?null:R);back();toast(T().rulesSaved);}
 else if(a==='rcity'){st.rulesDraft=JSON.parse(JSON.stringify(CITY));render();}
 else if(a==='samplestop'){st.stop=null;go('b4');}
 else if(a==='orig'){st.showOrig=!st.showOrig;render();}
 else if(a==='install'){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render();});}}
 else if(a==='instx'){try{localStorage.setItem('al_inst','1')}catch(e){}render();}
 else if(a==='retry'){st.stack.pop();st.photo=null;render();}
 else if(a==='pick'){st.stack.splice(-2,2);go('w5');}else if(a==='intro'){st.stack=['intro'];render();}
 else if(a==='startsurv'){st.qi=0;st.answers=[];go('sq');}
 else if(a==='qprev'){if(st.qi>0){st.qi--;render()}else back();}
 else if(a==='qnext'){if(st.qi<T().sq.length-1){st.qi++;render()}else{saveSurvey();grantAdFree();st.stack=['home','sdone'];render();}}
});

/* ---------- press feedback (touchdown) ---------- */
const PRESS='button,a,label.shutter,label.idot,[data-go],[data-act],[data-naver],[data-sel],[data-ans],.cc,.choice,.opt,.qopt';
function tagFx(root){root.querySelectorAll(PRESS).forEach(n=>n.classList.add('fx'));}
new MutationObserver(m=>m.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.matches&&n.matches(PRESS))n.classList.add('fx');tagFx(n);}}))).observe(document.body,{childList:true,subtree:true});
let pressed=null,pressTimer=0;
const release=()=>{clearTimeout(pressTimer);if(pressed){const p=pressed;pressed=null;setTimeout(()=>p.classList.remove('is-pressed'),90);}};
document.addEventListener('pointerdown',e=>{const el=e.target.closest(PRESS);if(!el||el.disabled)return;release();pressed=el;el.classList.add('is-pressed');},{passive:true});
['pointerup','pointercancel','dragstart'].forEach(t=>document.addEventListener(t,release,{passive:true}));
document.addEventListener('scroll',release,{passive:true,capture:true});
document.addEventListener('pointermove',e=>{if(pressed&&e.pointerType!=='mouse'&&!pressed.contains(document.elementFromPoint(e.clientX,e.clientY)))release();},{passive:true});
document.addEventListener('touchstart',()=>{},{passive:true}); /* enables :active on iOS */

/* ---------- desktop fit + modal ---------- */
function fit(){const ph=document.getElementById('phone');if(innerWidth<=500){ph.style.transform='';return}const s=Math.min(1,(innerHeight-48)/864);ph.style.transform=`scale(${s})`;ph.style.margin=`${-(844*(1-s))/2}px ${-(390*(1-s))/2}px`;}
addEventListener('resize',fit);fit();
const modal=document.getElementById('modal');
let seen=false;try{seen=sessionStorage.getItem('al_modal')==='1'}catch(e){}
if(innerWidth>500&&!seen){modal.hidden=false;document.getElementById('mclose').focus();}
document.getElementById('mclose').addEventListener('click',()=>{modal.hidden=true;try{sessionStorage.setItem('al_modal','1')}catch(e){}});
modal.addEventListener('click',e=>{if(e.target===modal)document.getElementById('mclose').click()});
render();
})();
</script>
